name: publish

on:
  push:
    branches:
      - master
      - ci/**          # allow test branches to run
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shared-goals/text-forge@main
        with:
          mkdocs_config: mkdocs.yml
          docs_dir: text
          site_dir: public
          cover_image: text/img/cover.jpg

      # Build verification artifact (works on any branch)
      - uses: actions/upload-artifact@v7
        with:
          name: site-public
          path: public

      # Deploy only from master (prevents branch tests from overwriting prod Pages)
      - if: github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6
      - if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - if: github.ref == 'refs/heads/master'
        uses: actions/deploy-pages@v5
        id: deploy

      - name: Published site URL
        if: github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          echo "Published: ${{ steps.deploy.outputs.page_url }}"
          echo "Published: ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"